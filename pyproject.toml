[project]
name = "finkan"
version = "1.0.0"
description = "Real-time financial prediction platform (MT5 + ONNX + FastAPI)"
requires-python = ">=3.10"
dependencies = [
    "fastapi==0.135.2",
    "uvicorn==0.42.0",
    "python-dotenv==1.2.2",
    "PyYAML==6.0.3",
    "MetaTrader5==5.0.5735",
    "onnxruntime==1.24.3",
    "numpy==2.4.2",
    "pandas==2.3.3",
    "scikit-learn==1.8.0",
    "joblib==1.5.3",
    "pytz==2026.1.post1",
]

[project.optional-dependencies]
train = [
    "torch==2.10.0",
    "scipy==1.17.1",
    "psutil==7.2.2",
    "matplotlib==3.10.8",
    "polars==1.39.0",
]
dev = [
    "pytest==9.0.2",
    "pytest-asyncio==1.3.0",
    "httpx==0.28.1",
]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
pythonpath = ["backend"]
asyncio_mode = "auto"
