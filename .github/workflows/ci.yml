name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

jobs:
  tests:
    # windows-latest: o pacote MetaTrader5 só publica wheels para Windows,
    # e é a plataforma-alvo do projeto.
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Run tests
        run: python -m pytest -v
